[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vp"
version = "0.1.0"
description = "CLI dich file Trung-Viet theo pipeline tab File cua vietphrase.app."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "onnxruntime-gpu>=1.20",
    "nvidia-cublas-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cudnn-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-cufft-cu12",
    "nvidia-curand-cu12",
    "nvidia-nvjitlink-cu12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vp = "vp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vp"]
